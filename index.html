<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="application-name" content="LearnUp" />
    <meta name="apple-mobile-web-app-title" content="LearnUp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="rgba(23, 20, 25)"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="rgba(250, 244, 235)"
    />
    <!-- Preload the app-wide UI fonts (the body font is 'IranSans Roboto') so text
         paints in the correct font immediately. Reader-only fonts are warmed lazily
         when a book opens (see preloadReaderFonts). crossorigin is required for the
         preload to match the font fetch, which is always made in anonymous CORS mode. -->
    <link
      rel="preload"
      href="/fonts/IranSans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Roboto-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>LearnUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
