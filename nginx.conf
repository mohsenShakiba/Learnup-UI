user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {

  include /etc/nginx/mime.types;

  default_type application/octet-stream;

  # Maps the client's Upgrade header to the Connection header value nginx
  # forwards upstream: "upgrade" for WebSocket handshakes, "close" otherwise.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  log_format main 'host: "$host", request: "$request"';

  access_log /var/log/nginx/access.log main;

  sendfile on;

  keepalive_timeout 65;

  gzip on;

  server {
    gzip on;
    client_max_body_size 10M;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain

      text/css

      application/javascript

      application/json

      application/x-javascript

      text/xml

      application/xml

      application/xml+rss

      text/javascript

      application/vnd.ms-fontobject

      application/x-font-ttf

      font/opentype

      image/svg+xml

      image/x-icon;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /rest/ {
      proxy_pass http://learnup:5050/;

      # SignalR needs HTTP/1.1 and the WebSocket upgrade handshake to be
      # forwarded so it can negotiate and keep the connection open.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Keep long-lived SignalR connections alive and disable response
      # buffering so server-sent messages are flushed immediately.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 100s;
      proxy_send_timeout 100s;
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Vite emits content-hashed filenames under /assets/ — safe to cache forever.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Static media (fonts, images, icons). Filenames aren't hashed, so revalidate
    # cheaply but still keep them out of the network path for a month.
    location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp)$ {
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }

    # The service worker and manifest must always be revalidated so PWA
    # autoUpdate can ship new builds; index.html likewise is the app entrypoint.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

  }

}